<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台看板 - 班级心语屋</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f7f4f0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        /* 登录框样式 */
        .login-box { background: #fff; padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; margin: 100px auto; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        input[type="password"] { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; text-align: center; }
        button { background: #5a4b41; color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; transition: 0.3s; }
        button:hover { background: #3e332b; }
        
        /* 数据看板样式 */
        .data-board { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #e0d6c8; padding-bottom: 15px; }
        .header h2 { color: #5a4b41; }
        .refresh-btn { background: #c9a070; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; width: auto; }
        .refresh-btn:hover { background: #b08a5e; }

        /* 两个模块的布局 */
        .modules-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .module { flex: 1; min-width: 300px; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border-top: 5px solid transparent; }
        .module.treehole-module { border-top-color: #2e7d32; } /* 绿色边框代表树洞 */
        .module.suggestion-module { border-top-color: #1565c0; } /* 蓝色边框代表建议 */
        
        .module-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .module-title.treehole-title { color: #2e7d32; }
        .module-title.suggestion-title { color: #1565c0; }
        .count-badge { background: #f0ede9; color: #666; font-size: 12px; padding: 2px 8px; border-radius: 10px; }

        /* 卡片样式 */
        .card { background: #faf9f7; padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #e0d6c8; }
        .card-header { display: flex; justify-content: flex-end; margin-bottom: 8px; font-size: 12px; color: #999; }
        .content { font-size: 15px; line-height: 1.5; white-space: pre-wrap; color: #333; }
        .empty-tip { color: #999; font-size: 14px; text-align: center; padding: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- 登录界面 -->
    <div class="login-box" id="loginBox">
        <h2>导员专属后台</h2>
        <p style="color:#999; margin-top:10px; font-size:14px;">请输入密码查看数据</p>
        <input type="password" id="passwordInput" placeholder="请输入密码">
        <button onclick="checkPassword()">进入看板</button>
    </div>

    <!-- 数据界面 -->
    <div class="data-board" id="dataBoard">
        <div class="header">
            <h2>班级心语屋 - 数据总览</h2>
            <button class="refresh-btn" onclick="fetchData()">刷新数据</button>
        </div>
        
        <div class="modules-container">
            <!-- 左侧：心理树洞模块 -->
            <div class="module treehole-module">
                <div class="module-title treehole-title">
                    <span>🌳 心理树洞</span>
                    <span class="count-badge" id="treeholeCount">0 条</span>
                </div>
                <div id="treeholeList">
                    <!-- 树洞数据 -->
                </div>
            </div>

            <!-- 右侧：班级建议模块 -->
            <div class="module suggestion-module">
                <div class="module-title suggestion-title">
                    <span>💡 班级建议</span>
                    <span class="count-badge" id="suggestionCount">0 条</span>
                </div>
                <div id="suggestionList">
                    <!-- 建议数据 -->
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ⚠️ 密码你可以自己改成别的
    const ADMIN_PASSWORD = '123456';

    // ⚠️ 你的 Supabase 配置
    const SUPABASE_URL = 'https://wolkqfghnfrumlznymql.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SrYSo1bxjptkT58GnII5tg_leUceKB3';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    // 检查密码
    function checkPassword() {
        const pwd = document.getElementById('passwordInput').value;
        if (pwd === ADMIN_PASSWORD) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dataBoard').style.display = 'block';
            fetchData(); 
        } else {
            alert('密码错误！');
        }
    }

    // 从数据库拉取并分类数据
    async function fetchData() {
        const treeholeList = document.getElementById('treeholeList');
        const suggestionList = document.getElementById('suggestionList');
        
        treeholeList.innerHTML = '<p class="empty-tip">正在加载...</p>';
        suggestionList.innerHTML = '<p class="empty-tip">正在加载...</p>';

        try {
            // 获取所有数据，按时间倒序
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            // 如果完全没有数据
            if (data.length === 0) {
                treeholeList.innerHTML = '<p class="empty-tip">暂无树洞留言</p>';
                suggestionList.innerHTML = '<p class="empty-tip">暂无班级建议</p>';
                return;
            }

            // 分类数据
            const treeholeData = data.filter(item => item.type === 'treehole');
            const suggestionData = data.filter(item => item.type === 'suggestion');

            // 更新数量统计
            document.getElementById('treeholeCount').innerText = `${treeholeData.length} 条`;
            document.getElementById('suggestionCount').innerText = `${suggestionData.length} 条`;

            // 渲染树洞
            renderList(treeholeData, 'treeholeList', '暂无树洞留言');
            // 渲染建议
            renderList(suggestionData, 'suggestionList', '暂无班级建议');

        } catch (error) {
            console.error(error);
            treeholeList.innerHTML = `<p class="empty-tip" style="color:red;">加载失败: ${error.message}</p>`;
            suggestionList.innerHTML = `<p class="empty-tip" style="color:red;">加载失败: ${error.message}</p>`;
        }
    }

    // 独立的渲染函数
    function renderList(dataArray, containerId, emptyTip) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // 清空

        if (dataArray.length === 0) {
            container.innerHTML = `<p class="empty-tip">${emptyTip}</p>`;
            return;
        }

        dataArray.forEach(item => {
            // 格式化时间 (月日 时:分)
            const date = new Date(item.created_at);
            const timeStr = `${date.getMonth()+1}月${date.getDate()}日 ${date.getHours()}:${date.getMinutes().toString().padStart(2, '0')}`;

            const card = document.createElement('div');
            card.className = 'card';
            
            // 只显示时间，不显示标签了（因为分模块了）
            card.innerHTML = `
                <div class="card-header">${timeStr}</div>
                <div class="content"></div>
            `;
            
            // 防止 XSS
            card.querySelector('.content').textContent = item.content;
            container.appendChild(card);
        });
    }
</script>

</body>

</html>
